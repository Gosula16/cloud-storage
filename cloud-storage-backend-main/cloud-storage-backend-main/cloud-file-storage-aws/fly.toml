app = "cloud-storage-backend-krish"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  CLIENT_ORIGIN = "https://cloud-storage-frontend1-master.vercel.app"
  ALLOW_VERCEL_ORIGINS = "true"
  JWT_EXPIRES_IN = "7d"
  MAX_FILE_SIZE_BYTES = "26214400"
  SIGNED_URL_EXPIRES_SECONDS = "3600"
  DATA_DIR = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
